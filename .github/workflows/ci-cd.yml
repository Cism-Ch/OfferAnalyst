name: OfferAnalyst CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'mongodb://localhost:27017/test'
      BETTER_AUTH_SECRET: 'test-secret-min-32-chars-long-for-ci-pipeline'
      BETTER_AUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Run ESLint
        run: pnpm run lint

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [quality-gate]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      OPENROUTER_API_KEY: 'sk-or-v1-mock-key-for-ci-build-only'
      DATABASE_URL: 'mongodb://localhost:27017/test'
      BETTER_AUTH_SECRET: 'test-secret-at-least-32-chars-long-for-ci-builds'
      BETTER_AUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build application
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .next/
          retention-days: 7

  release-publish:
    name: GitHub Release Automation
    runs-on: ubuntu-latest
    needs: [quality-gate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
